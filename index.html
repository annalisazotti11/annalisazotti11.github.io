<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183F3A">
  <title>AZ Itinerary Studio</title>
  <meta name="robots" content="index,follow">
  <style>
    html,body{height:100%;margin:0;background:#183F3A;color:#F6F1E8;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    main{text-align:center;padding:24px}
    .mark{font:400 2.6rem Georgia,serif}
    p{margin:12px 0 0;opacity:.75;font-size:.88rem}
    a{color:#F6F1E8}
  </style>
  <script>
    (function () {
      var narrow = window.matchMedia("(max-width: 720px)").matches;
      var mobileUA = /iPhone|iPod|Android.*Mobile|Windows Phone/i.test(navigator.userAgent);
      var target = (narrow || mobileUA) ? "mobile.html" : "desktop.html";
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark">AZ</div>
    <p>Caricamento del sito…</p>
    <noscript>
      <p><a href="mobile.html">Versione telefono</a> · <a href="desktop.html">Versione desktop</a></p>
    </noscript>
  </main>
</body>
</html>
